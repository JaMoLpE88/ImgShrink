[workspace]
resolver = "2"
members = [
    "crates/imgshrink-core",
    "crates/imgshrink-tui",
    "crates/imgshrink-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
authors = ["JaMoLpE88 <https://jmolo.es>"]

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
png = "0.17"
oxipng = { version = "9", default-features = false }
webp = "0.3"
kamadak-exif = "0.6"
tempfile = "3"
walkdir = "2"
crossbeam-channel = "0.5"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
