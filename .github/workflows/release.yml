name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CC_x86_64_unknown_linux_musl: musl-gcc
  AR_x86_64_unknown_linux_musl: ar

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            native: true
            archive: zip
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            native: true
            archive: tar.gz
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            native: false
            archive: tar.gz
          - name: linux-x64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            native: true
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Static CRT (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        run: cargo build --release --target "${{ matrix.target }}" -p imgshrink-cli
      - name: Self-test (native only)
        if: matrix.native
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./target/${{ matrix.target }}/release/imgshrink.exe --selftest
          else
            ./target/${{ matrix.target }}/release/imgshrink --selftest
          fi
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          NAME="imgshrink-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/imgshrink.exe" "dist/${NAME}/"
          else
            cp "target/${{ matrix.target }}/release/imgshrink" "dist/${NAME}/"
          fi
          cp README.md LICENSE THIRD_PARTY.md "dist/${NAME}/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path '${NAME}\*' -DestinationPath '${NAME}.zip'"
          else
            tar -czf "${NAME}.tar.gz" "${NAME}"
          fi
      - name: Checksums
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            sha256sum "imgshrink-${{ matrix.target }}.zip" > "imgshrink-${{ matrix.target }}.zip.sha256"
          else
            sha256sum "imgshrink-${{ matrix.target }}.tar.gz" > "imgshrink-${{ matrix.target }}.tar.gz.sha256"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: false
